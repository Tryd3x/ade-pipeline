x-common:
  &common
  volumes: 
  - /var/run/docker.sock:/var/run/docker.sock
  - ../spark/jobs:/usr/local/jobs
  - ../keys/gcs-credentials.json:/keys/gcs-credentials.json:ro
  
  networks:
    - shared_network

networks:
  shared_network:
    name: shared_network
    external: true
services:
  scheduler:
    user: root
    <<: *common
  webserver:
    <<: *common
  triggerer:
    <<: *common

