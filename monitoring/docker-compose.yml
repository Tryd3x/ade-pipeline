networks:
  monitor-network:
    name: monitor-network

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./volume/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - monitor-network
  
  grafana:
    container_name: grafana
    image: grafana/grafana
    networks:
    - monitor-network
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  ingestion:
    image: ade-pipeline/openfda:latest
    container_name: ingestion
    networks:
      - monitor-network
    command: "--year=2004,2005 --max_batch_size=2000"
    ports:
      - "8000:8000"
    depends_on:
      prometheus:
          condition: service_started
    volumes:
      - /home/hyderreza/codehub/ade-pipeline/keys/gcs-credentials.json:/app/gcs-credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcs-credentials.json